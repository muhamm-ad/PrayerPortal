version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    allow:
      - dependency-type: "all"
    labels:
      - "dependencies"
      - "pip"
    groups:
      adafruit:
        patterns:
          - "adafruit*"
          - "neopixel"
          - "simpleio"
      python-other:
        patterns:
          - "*"
        exclude-patterns:
          - "adafruit*"
          - "neopixel"
          - "simpleio"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "gh-actions"
    groups:
      github-actions:
        patterns:
          - "*"
